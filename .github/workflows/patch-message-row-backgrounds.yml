name: Patch message row backgrounds

on:
  push:
    paths:
      - '.github/scripts/patch-message-row-backgrounds.py'
      - '.github/workflows/patch-message-row-backgrounds.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch userscript
        run: python .github/scripts/patch-message-row-backgrounds.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/patch-message-row-backgrounds.py .github/workflows/patch-message-row-backgrounds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix unread and selected message backgrounds'
          git push
