name: Patch message selection gray

on:
  push:
    paths:
      - 'tools/patch_message_selection_gray.py'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python tools/patch_message_selection_gray.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          rm -f tools/patch_message_selection_gray.py .github/workflows/patch-message-selection-gray.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use neutral gray for selected message rows" || exit 0
          git push
