name: Patch collapsed hidden folders

on:
  push:
    paths:
      - '.github/workflows/patch-collapsed-hidden-folders.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python .github/scripts/patch-collapsed-hidden-folders.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/patch-collapsed-hidden-folders.py .github/workflows/patch-collapsed-hidden-folders.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide phantom folders in collapsed sidebar" || exit 0
          git push
