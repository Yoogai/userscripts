name: Patch focus resizers

on:
  push:
    paths:
      - '.tmp-patch-focus-resizers.py'
      - '.github/workflows/patch-focus-resizers.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch userscript
        run: python .tmp-patch-focus-resizers.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .tmp-patch-focus-resizers.py .github/workflows/patch-focus-resizers.yml
          git add mail-adygheya-redesign.user.js
          git commit -m "Hide resize handles in message reading mode"
          git push
