name: Patch message spacing v3.1.31

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip v331 patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch userscript
        run: python .github/patches/patch-message-spacing-v331.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail-adygheya-redesign.user.js
          git rm .github/patches/patch-message-spacing-v331.py .github/workflows/patch-message-spacing-v331.yml
          git commit -m "Adjust message list spacing [skip v331 patch]"
          git push
