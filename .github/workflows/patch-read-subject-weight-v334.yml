name: Patch read subject weight v3.1.34

on:
  push:
    paths:
      - '.github/workflows/patch-read-subject-weight-v334.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch userscript
        run: python .github/scripts/patch-read-subject-weight-v334.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          rm -f .github/scripts/patch-read-subject-weight-v334.py .github/workflows/patch-read-subject-weight-v334.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make read message subjects regular weight"
          git push
