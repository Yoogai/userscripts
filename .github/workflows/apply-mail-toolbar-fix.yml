name: Apply mail toolbar fix

on:
  push:
    branches:
      - fix/mail-toolbar-copy-email

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mail-toolbar-copy-email
          fetch-depth: 0

      - name: Patch userscript
        shell: python
        run: |
          from pathlib import Path

          path = Path('mail-adygheya-redesign.user.js')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once('// @version      3.1.9', '// @version      3.1.10', 'metadata version')
          replace_once("console.log('[Почта Адыгеи Redesign v3.1.9] Скрипт инициализирован');", "console.log('[Почта Адыгеи Redesign v3.1.10] Скрипт инициализирован');", 'console version')

          old_css = '''      html.ady-redesign #rl-right > div.rl-view-model.RL-SystemDropDown > div > div {
