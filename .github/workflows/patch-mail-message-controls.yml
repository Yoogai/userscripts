name: Patch mail message controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch userscript
        run: python3 .github/patch-mail-message-controls.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        shell: bash
        run: |
          rm -f .github/patch-mail-message-controls.py
          rm -f .github/workflows/patch-mail-message-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix message floating controls and download-all visibility"
          git push origin HEAD:main
