name: Patch settings chrome

on:
  push:
    paths:
      - '.github/workflows/patch-settings-chrome-v329.yml'
      - '.github/scripts/patch-settings-chrome-v329.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch userscript
        run: python .github/scripts/patch-settings-chrome-v329.py
      - name: Check JavaScript syntax
        run: node --check mail-adygheya-redesign.user.js
      - name: Commit fix and cleanup
        run: |
          rm .github/workflows/patch-settings-chrome-v329.yml
          rm .github/scripts/patch-settings-chrome-v329.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mail-adygheya-redesign.user.js .github
          git commit -m "Hide mail chrome in settings"
          git push
